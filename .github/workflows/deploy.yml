name: deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      tag:
        required: true
        type: string
      break_probe:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ inputs.environment }}

      - name: Pull the image from GHCR and load it into the cluster
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${{ inputs.image }}:${{ inputs.tag }}"
          kind load docker-image "${{ inputs.image }}:${{ inputs.tag }}" --name "${{ inputs.environment }}"

      - name: Deploy with Helm (atomic)
        run: |
          helm upgrade --install orders-api ./chart \
            --namespace "${{ inputs.environment }}" --create-namespace \
            -f "chart/values-${{ inputs.environment }}.yaml" \
            --set image.repository="${{ inputs.image }}" \
            --set image.tag="${{ inputs.tag }}" \
            --set probes.readinessPath="${{ inputs.break_probe && '/wrong' || '/health' }}" \
            --atomic --timeout 2m

      - name: Smoke test
        run: |
          kubectl -n "${{ inputs.environment }}" get pods
          kubectl -n "${{ inputs.environment }}" port-forward svc/orders-api 8080:80 &
          sleep 5
          curl -fsS http://localhost:8080/health
          curl -fsS "http://localhost:8080/discount?price=100&code=SAVE10"
          curl -fsS http://localhost:8080/

      - name: Show events if something failed
        if: failure()
        run: kubectl -n "${{ inputs.environment }}" get events --sort-by=.lastTimestamp || true
