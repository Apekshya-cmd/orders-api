name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      break_probe:
        description: "Break the readiness probe to watch --atomic fail the deploy"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------- Runs on pull requests AND on main ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Helm lint
        run: helm lint chart -f chart/values-prod.yaml

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ---------- Only after merge to main: build ONCE ----------
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out image name (must be lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (tag = commit SHA)
        run: docker build -t ${{ steps.meta.outputs.image }}:${{ github.sha }} .

      - name: Scan image (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

      - name: Push image
        run: docker push ${{ steps.meta.outputs.image }}:${{ github.sha }}

  # ---------- Promote the SAME image through each environment ----------
  deploy-dev:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image: ${{ needs.build.outputs.image }}
      tag: ${{ needs.build.outputs.tag }}
      break_probe: ${{ inputs.break_probe || false }}

  deploy-qa:
    needs: [build, deploy-dev]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: qa
      image: ${{ needs.build.outputs.image }}
      tag: ${{ needs.build.outputs.tag }}

  deploy-prod:
    needs: [build, deploy-qa]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod # protect this environment with required reviewers
      image: ${{ needs.build.outputs.image }}
      tag: ${{ needs.build.outputs.tag }}
